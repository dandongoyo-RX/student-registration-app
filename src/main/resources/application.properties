spring.application.name=StudentRegistration

# Port the app listens on (hosting platforms set PORT for you)
server.port=${PORT:8080}

# ---------------------------------------------------------------
# Database
# Default: H2 database saved to the file ./data/students.mv.db
# in the project folder. Nothing to install; data survives restarts.
#
# To use PostgreSQL instead, set these environment variables:
#   DB_URL=jdbc:postgresql://localhost:5432/studentdb
#   DB_USERNAME=postgres
#   DB_PASSWORD=postgres
# ---------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/students;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# H2 web console: http://localhost:8080/h2-console
# Set H2_CONSOLE=false when deployed (it is only useful with the local H2 database)
spring.h2.console.enabled=${H2_CONSOLE:true}
spring.h2.console.path=/h2-console

# Create/update the "students" table automatically from the Student class
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Print the SQL Hibernate runs (handy while learning; set to false later)
spring.jpa.show-sql=${SHOW_SQL:true}
